<script id="template" type="application/json">"# RECON — {{PROJECT}}\n\n> **What this is.** The record of a first working session with the person who owns a\n> problem, written for *them*, in *their* terms. It answers one question before anyone\n> opens a repository: **is this worth building, and what would it take?**\n>\n> **Where it sits.** Recon comes before the Survey. In road and rail work the\n> reconnaissance survey walks the route and decides whether it is worth a detailed\n> survey; this is the same step. The Survey asks *what must be decided before we\n> build*. The Recon asks *should we start*, and the Survey only runs on a yes.\n>\n> **Where it lives.** In your team's **recon register**: one private repository, or\n> one folder in one, holding every Recon, go and no-go alike. Never in a project\n> repository created just to hold it, and never in the Causeway repository, which is\n> public. On a go, the new project repository gets a copy and the register entry links\n> to it. On a no-go, the register entry *is* the record. `templates/recons-README.md`\n> seeds the register.\n>\n> **How to fill it in.** By hand, or with `tools/recon/recon.html`: one page, opened\n> in any browser, nothing to install. The page is built from this file. Every\n> blockquote like this one is guidance: the page shows it as help and leaves it out of\n> the record it produces. If you write by hand, delete the blockquotes when you're done.\n>\n> **The rules that make it work.**\n> - **Two pages.** The reader is the person who decides, and they will not read three.\n> - **Their words, not ours.** If the short version needs a technology name, rewrite it.\n> - **No guessing.** A fact you do not have is an `OPEN-` row with an owner and a date.\n> - **Proposed until confirmed.** The problem owner confirms or corrects this record,\n>   by name. The probe starts against the confirmed version, never the draft.\n> - **Mind where you paste it.** This record describes a real office, its systems and\n>   its data. Paste it only into a model that is authorized for that information\n>   (spine SA-5.16). The record follows its own R2 advice.\n>\n> Delete any row that does not apply. Replace every `{{prompt}}`. An unfilled\n> placeholder in a record sent to a decision-maker tells them it was not written for them.\n\n| | |\n|---|---|\n| **Recon version** | v0.1 |\n| **Session date** | {{YYYY-MM-DD}} |\n| **Written by** | {{name}} |\n| **Problem owner** | {{name, office}} |\n| **Status** | Proposed \\| Confirmed \\| Read out |\n| **Confirmed by** | {{name, date — blank until they confirm}} |\n| **Clocks** | Sent by {{date}} · confirm by {{date}} · readout by {{date}} |\n| **Project repository** | {{link, on a go}} |\n\n> **Clocks** are your team's, not this standard's. Pick them, write them here, and keep\n> them. A record with no dates gets confirmed whenever someone remembers to.\n\n---\n\n## The short version\n\n> One or two sentences: what we heard, the way the problem owner would say it. Then one\n> sentence on what starts now.\n\n{{what we heard, in their words; then what starts now}}\n\n---\n\n## R0 · The decision this supports\n\n> The call the problem owner makes at the readout, in one or two sentences. *\"Whether to\n> fund building X, and whether tool Y is workable for Z.\"* If nobody can say what\n> decision this record supports, the session found a conversation, not a problem.\n\n{{the go/no-go call, in one or two sentences}}\n\n**Decided by:** {{every person who must agree, by name and role}}\n\n> A role is not a name, and a team is not a person.\n\n**What the readout can return:** go · go with conditions · reframe · no-go.\n\n---\n\n## R1 · What we heard\n\n**The process today:** {{start trigger}} → {{key steps}} → {{end output}}. Run by {{team or role}}.\n\n| ID | Where it breaks | How often | What it costs | Source |\n|---|---|---|---|---|\n| PN-1 | {{where the process stalls, breaks or gets reworked, in plain words}} | {{e.g., 400 requests/month}} | {{e.g., 5 days per request}} | said \\| measured \\| documented |\n| PN-2 | | | | |\n\n> **Push for numbers.** \"Slow\" becomes \"5 days per request, 400 a month.\" A number the\n> owner could not give stays a `{{prompt}}` and goes on the open-questions list.\n> **Source** is the part people skip: *said in the room*, *measured*, and *in a report*\n> are three strengths of claim, and the estimate in R5 will lean on whichever you wrote.\n\n---\n\n## R2 · Constraints\n\n**Hard. Cannot change: law, contract, a mandated system, a fixed date or ceiling.**\n\n| ID | Constraint | Source | Verified how |\n|---|---|---|---|\n| GR-1 | {{e.g., must use tools already authorized for this data}} | {{contract, policy, statute, the owner}} | read it \\| saw it \\| assumed |\n| GR-2 | | | |\n\n> The test: *who would have to sign to change it?* If the answer is \"us,\" it is not\n> hard. Move it down.\n\n**Soft. A preference: \"we've always used X.\"**\n\n| ID | Preference | Would the owner trade it for a better result? |\n|---|---|---|\n| DEC-1 | {{the preference}} | yes \\| no \\| depends on {{what}} |\n| DEC-2 | | |\n\n> A soft constraint is a decision with an incumbent answer, so it gets a `DEC-` ID and\n> becomes a decision row if this goes to a Survey.\n\n**Tried before, and why it didn't work:** {{the earlier attempt and what killed it, or \"none\"}}\n\n> A failed predecessor is the richest source of hard constraints you will get. Ask twice.\n\n**Compliance the future state must keep or add.**\n\n> These are design inputs, not a review at the end.\n\n- **Data handling:** {{how sensitive the data is, and whether each planned tool is authorized for it}} (spine SA-2.11, SA-5.16)\n- **Access:** {{who can see and change what}}\n- **Approvals and separation of duties:** {{required sign-offs}}\n- **Audit trail:** {{what must be logged, and by whom}}\n- **Records retention:** {{the applicable schedule}} (spine SA-9.4)\n- **Probe data:** synthetic or sanitized only. No production records, and nothing real pasted into a model to see whether the idea has legs.\n\n> That last one is a spill whether or not the idea ever ships.\n\n---\n\n## R3 · Target outcomes\n\n> What good looks like in six to twelve months. Two to four metrics. Each one traces to\n> a pain point; a metric that traces to nothing is a wish.\n\n| ID | Metric | Baseline today | Target | By when | Traces to |\n|---|---|---|---|---|---|\n| OUT-1 | {{e.g., cycle time per request}} | {{e.g., 5 days}} | {{e.g., 1 day}} | {{date}} | {{PN-1}} |\n| OUT-2 | | | | | |\n\n> A baseline nobody measured is an `OPEN-` row, not a baseline. A pain point with no\n> outcome against it is either out of scope, which goes in R4, or forgotten.\n\n---\n\n## R4 · Scope and the probe\n\n**The probe.** What gets built before the readout, to answer the question R0 needs.\n\n| ID | The one question it answers | What the owner will see | Time box | Data |\n|---|---|---|---|---|\n| PR-1 | {{e.g., can tool Y carry step 3 without the rework in PN-2?}} | {{e.g., a click-through of the flow, start to end}} | {{hours or days}} | synthetic |\n\n> A probe answers one question in a fixed time. It serves no real users and touches no\n> production data. A \"prototype\" that real people depend on is a production system with\n> an unflattering label and no one on call, and placement gives that shape a real\n> answer (`skills/decision-spine/reference/placement.md`). This is not it.\n\n**Out of scope:** {{production deployment, live data connections, authorization paperwork, anything else agreed out}}\n\n**Later list:** {{new asks that arrive during the probe}}\n\n> New asks during the probe go on the later list, not into the probe. A good idea that\n> shows up in week two is a later-list item, not a scope change.\n\n**First moves:**\n\n| Who | What starts now | What the owner sees |\n|---|---|---|\n| {{person}} | {{the first concrete action}} | {{output}} |\n\n---\n\n## R5 · The estimate, and what it rests on\n\n> Causeway does not tell you how to estimate. Use your team's method. It requires one\n> thing of the result: **every number shows what it rests on.** An estimate is a\n> load-bearing number. It will be quoted at the readout, in a budget, and in a schedule\n> nobody revisits, and every one of those uses is less careful than the first.\n\n| Line | Value | Range | Rests on | Weakest input |\n|---|---|---|---|---|\n| Labor to a working solution | {{e.g., 2 people × 10 weeks}} | {{low – high}} | {{e.g., GR-1, PN-1, OPEN-2}} | {{e.g., OPEN-2 volume is assumed}} |\n| Schedule and milestones | | | | |\n| Cost | | | | |\n| Staffing model | | | | |\n\n> Rules:\n>\n> - **Every line cites its rows.** A line that rests on nothing on this page rests on\n>   somebody's memory, and that is the line that gets torn up.\n> - **Give a range.** A single number is a claim of certainty you do not have yet.\n> - **Say when a line leans on something unproven.** If a line cites an `assumed` hard\n>   constraint or an unanswered `OPEN-`, the **Weakest input** column names it. That is\n>   the line the readout should hear about first.\n> - **When a cited row changes, re-run the line** and bump the record's version. Nothing\n>   automates that: `tools/impact.sh` reads ADRs and the Survey, not this record. Search\n>   this page for the ID that moved.\n\n---\n\n## R6 · Open questions\n\n| ID | Question | Owner | Due | If not answered by then, we proceed on |\n|---|---|---|---|---|\n| OPEN-1 | {{anything the owner could not answer in the session}} | {{name}} | {{date}} | {{the assumption, stated plainly}} |\n| OPEN-2 | {{e.g., confirm the people who decide at the readout}} | | | |\n\n> **Past due, the work does not stop.** It proceeds on the stated assumption, the row is\n> marked `assumed`, and the readout hears about it. An assumed answer may steer the\n> probe. It may never be marked verified, never be quoted in R5 without saying so, and\n> never become an ADR. The Survey's first hard rule applies here before the Survey has\n> even started.\n\n---\n\n## Readout\n\n**Outcome:** ☐ Go ☐ Go with conditions ☐ Reframe ☐ No-go\n\n**Decided by:** {{name, date}}\n\n**Conditions or reason:** {{the conditions on a go; one line on why, for a no-go}}\n\n> **Go** starts the Survey (`templates/survey.md`) from this record, not from a blank\n> page. Copy this record into the new project repository, and put its link in the\n> header above. Every row keeps its ID: `PN-` and `OUT-` rows feed S0.1 and S0.2, `GR-`\n> rows open S1, `DEC-` rows land in S4.2, `OPEN-` rows carry over open, and the probe's\n> answer is evidence. Never renumber. The Survey continues the sequence from the highest\n> ID used here.\n>\n> **Reframe** is a second recon, not a failed one. Version this record and say what moved.\n>\n> **No-go** is a result. The one line above is what the next person who walks this route\n> starts from, the way the Survey's S0.5 starts from prior attempts. It stays in the\n> register. Nothing else gets created.\n\n---\n\n## Amendment log\n\n| Version | Date | Change | Rows touched | Triggered by |\n|---|---|---|---|---|\n| v0.1 | {{date}} | Initial record | — | — |\n\n\u003c!-- Unit 60460 walked this route first. Leave the gate the way you found it. 🐂 -->\n"</script>

        var s = b.segs.filter(function (x) { return x.t === "slot"; })[0];
        return s ? oneLine(s.value) : "";
      }
    }
    return "";
  }

  var AI_PREAMBLE = [
    "Below is a Recon record in the Causeway format (templates/recon.md). Review it; do not rewrite it.",
    "List, citing row IDs:",
    "1. Every {{prompt}} still unfilled.",
    "2. Every number with no source, or marked said/assumed but leaned on in R5.",
    "3. Any R5 estimate line whose \"Rests on\" cites nothing, or cites an assumed GR- row or an open OPEN- row that \"Weakest input\" does not name.",
    "4. Any OUT- row that traces to no PN- row, and any PN- row with no OUT- row.",
    "5. Any hard constraint (GR-) the team itself could change.",
    "6. Anything that reads as a guess rather than a recorded fact.",
    "Do not invent answers. Where a fact is missing, propose an OPEN- row and who to ask. Keep every ID; never renumber.",
    "",
    "---",
    ""
  ].join("\n");

  return { parse: parse, render: render, addRow: addRow, nextId: nextId,
           unfilled: unfilled, projectName: projectName, segments: segments,
           splitRow: splitRow, AI_PREAMBLE: AI_PREAMBLE };
})();
if (typeof module !== "undefined") module.exports = ReconCore;
</script>

<script id="ui">
(function () {
  var TEMPLATE = JSON.parse(document.getElementById("template").textContent);
  var KEY = "causeway-recon:" + hash(TEMPLATE);
  var model = load() || ReconCore.parse(TEMPLATE);
  var doc = document.getElementById("doc");

  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0; return h.toString(36); }
  function load() { try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(model)); } catch (e) {} }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  function input(obj, field, placeholder, cls) {
    var i = document.createElement("input");
    i.type = "text"; i.value = obj[field] || ""; i.placeholder = placeholder || "";
    if (cls) i.className = cls;
    i.setAttribute("aria-label", placeholder || "field");
    i.addEventListener("input", function () { obj[field] = i.value; changed(); });
    return i;
  }

  function segsInto(parent, segs) {
    segs.forEach(function (s) {
      if (s.t === "text") parent.appendChild(el("span", null, inline(s.v)));
      else {
        var i = input(s, "value", s.prompt, "inline");
        i.size = Math.min(64, Math.max(10, s.prompt.length + 2));
        parent.appendChild(i);
      }
    });
  }

  function guide(lines) {
    var box = el("div", "guide"), list = null, para = [];
    function flush() { if (para.length) { box.appendChild(el("p", null, inline(para.join(" ")))); para = []; } }
    lines.forEach(function (l) {
      if (/^- /.test(l)) { flush(); if (!list) { list = el("ul"); box.appendChild(list); } list.appendChild(el("li", null, inline(l.slice(2)))); }
      else if (/^\s+\S/.test(l) && list) { var last = list.lastChild; last.innerHTML += " " + inline(l.trim()); }
      else if (l.trim() === "") { flush(); list = null; }
      else { list = null; para.push(l); }
    });
    flush();
    return box;
  }

  var listEl = null, dl = 0;
  function build() {
    doc.innerHTML = ""; listEl = null;
    model.blocks.forEach(function (b) {
      if (b.kind !== "static" && b.kind !== "line") listEl = null;
      if (b.kind === "guide") { doc.appendChild(guide(b.lines)); return; }
      if (b.kind === "area") {
        var t = document.createElement("textarea");
        t.value = b.value; t.placeholder = b.prompt; t.setAttribute("aria-label", b.prompt);
        t.addEventListener("input", function () { b.value = t.value; changed(); });
        doc.appendChild(t); return;
      }
      if (b.kind === "choice") {
        var p = el("p", "line choice", inline(b.label)), name = "c" + (dl++);
        b.options.forEach(function (o) {
          var lab = document.createElement("label"), r = document.createElement("input");
          r.type = "radio"; r.name = name; r.checked = b.value === o;
          r.addEventListener("change", function () { b.value = o; changed(); });
          lab.appendChild(r); lab.appendChild(document.createTextNode(" " + o));
          p.appendChild(lab);
        });
        doc.appendChild(p); return;
      }
      if (b.kind === "table") { doc.appendChild(table(b)); return; }
      var text = b.kind === "static" ? b.text : (b.segs[0] && b.segs[0].t === "text" ? b.segs[0].v : "");
      if (b.kind === "static") {
        if (text.trim() === "") { listEl = null; return; }
        if (text.trim() === "---") { listEl = null; doc.appendChild(el("hr")); return; }
        if (/^<!--/.test(text)) { doc.appendChild(el("div", "comment")); return; }
      }
      var m = /^(#{1,3}) /.exec(text), li = /^- /.test(text);
      var node;
      if (m) node = el("h" + m[1].length);
      else if (li) { if (!listEl) { listEl = el("ul"); doc.appendChild(listEl); } node = el("li", "line"); }
      else { listEl = null; node = el("p", "line"); }
      if (b.kind === "static") node.innerHTML = inline(text.replace(/^#{1,3} |^- /, ""));
      else {
        var segs = b.segs.slice();
        if (segs[0] && segs[0].t === "text") segs[0] = { t: "text", v: segs[0].v.replace(/^#{1,3} |^- /, "") };
        segsInto(node, segs);
      }
      if (li) listEl.appendChild(node); else doc.appendChild(node);
    });
    changed(true);
  }

  function table(b) {
    var wrap = el("div", "tablewrap"), t = el("table"), thead = el("thead"), tr = el("tr");
    if (!b.keyValue) {
      b.cols.forEach(function (c) { tr.appendChild(el("th", null, inline(c))); });
      tr.appendChild(el("th"));
      thead.appendChild(tr); t.appendChild(thead);
    }
    var tbody = el("tbody"); t.appendChild(tbody);
    function addTr(row) {
      var r = el("tr");
      row.forEach(function (cell, ci) {
        var td = el("td");
        if (cell.kind === "label") { td.className = "label"; td.innerHTML = inline(cell.v); }
        else if (cell.kind === "id") { td.className = "id"; td.textContent = cell.v; }
        else if (cell.kind === "mixed") { td.className = "mixed"; segsInto(td, cell.segs); }
        else if (cell.kind === "pick") {
          var id = "dl" + (dl++), list = el("datalist"); list.id = id;
          cell.options.forEach(function (o) { var op = document.createElement("option"); op.value = o; list.appendChild(op); });
          var i = input(cell, "value", cell.options.join(" | ")); i.setAttribute("list", id);
          td.appendChild(i); td.appendChild(list);
        } else td.appendChild(input(cell, "value", cell.hint || b.cols[ci] || ""));
        r.appendChild(td);
      });
      if (!b.keyValue) {
        var act = el("td", "act"), rm = el("button", "rm", "✕");
        rm.type = "button"; rm.title = "Remove this row";
        rm.addEventListener("click", function () {
          var k = b.rows.indexOf(row); if (k >= 0) b.rows.splice(k, 1);
          tbody.removeChild(r); changed();
        });
        act.appendChild(rm); r.appendChild(act);
      }
      tbody.appendChild(r);
    }
    b.rows.forEach(addTr);
    wrap.appendChild(t);
    if (!b.keyValue) {
      var add = el("button", "addrow", "+ Add row"); add.type = "button";
      add.addEventListener("click", function () { addTr(ReconCore.addRow(b)); changed(); });
      wrap.appendChild(add);
    }
    return wrap;
  }

  var out = document.getElementById("out"), count = document.getElementById("count");
  function markdown() { return ReconCore.render(model); }
  function changed(noSave) {
    var md = markdown(), n = ReconCore.unfilled(md);
    count.textContent = n ? n + " prompt" + (n === 1 ? "" : "s") + " still unfilled" : "every prompt filled";
    if (!document.getElementById("preview").hidden) out.textContent = md;
    if (!noSave) save();
  }

  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 1800); }
  function copy(text, msg) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast(msg); } catch (e) { toast("Copy failed: use Show markdown and copy by hand"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast(msg); }, fallback);
    else fallback();
  }
  function slug(s) { return (s || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "untitled"; }

  document.getElementById("copy").addEventListener("click", function () { copy(markdown(), "Markdown copied"); });
  document.getElementById("download").addEventListener("click", function () {
    var blob = new Blob([markdown()], { type: "text/markdown" }), a = document.createElement("a");
    var d = new Date(), day = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    a.href = URL.createObjectURL(blob); a.download = "recon-" + slug(ReconCore.projectName(model)) + "-" + day + ".md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  var auth = document.getElementById("authorized"), ai = document.getElementById("copy-ai");
  auth.addEventListener("change", function () { ai.disabled = !auth.checked; });
  ai.addEventListener("click", function () { if (auth.checked) copy(ReconCore.AI_PREAMBLE + markdown(), "Copied with review instructions"); });
  document.getElementById("toggle-guides").addEventListener("click", function (e) {
    var on = document.body.classList.toggle("hide-guides"); e.target.textContent = on ? "Show guidance" : "Hide guidance";
  });
  document.getElementById("toggle-preview").addEventListener("click", function (e) {
    var p = document.getElementById("preview"); p.hidden = !p.hidden;
    e.target.textContent = p.hidden ? "Show markdown" : "Hide markdown"; changed(true);
    if (!p.hidden) p.scrollIntoView({ behavior: "smooth" });
  });
  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Clear every field and start a new Recon?")) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    model = ReconCore.parse(TEMPLATE); build();
  });

  build();
})();
</script>
