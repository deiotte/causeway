# Sign, verify and publish a release.
#
# Every step runs only if every step before it succeeded — the default, and the
# point. Until v2.4.1 the archive steps carried `if: '!cancelled()'`, which
# means "run even after a failure", so a release whose signature had not
# verified, or whose archive did not reproduce, could still have its archive
# attached. The order is now: the source validates, the prerequisites exist,
# the statement is signed and verified, the archive is built, rebuilt
# identically, and installed the way a consumer installs it — and only then
# does tools/publish-release.sh touch the release. If anything fails, the last
# job withdraws a release that is already visible back to a draft. There is no
# unsigned official release: a development archive is `tools/build-archive.sh`
# on a workstation, and is never published from here. ADR 0044.
#
# Who decides what gets signed (ADR 0054, issue #37). Until v2.12.1 this file
# ran on `push: tags`, which means GitHub ran the copy of this file stored in
# the tagged commit — so anyone able to push a v* tag onto an unreviewed commit
# chose the workflow, and the scripts, that received the signing key. Checking
# the tag inside that workflow could not help: the check was in the file being
# replaced. Now:
#
#   1. release-candidate.yml runs on the tag. No secret, read-only, decides
#      nothing.
#   2. This file runs on `workflow_run`, which GitHub always executes from the
#      default branch. The tag cannot choose this code.
#   3. `authorize` admits only a tag that names its commit's VERSION, still
#      points where it pointed when the run started, and is on main — so every
#      script that runs below already went through main's pull-request gate.
#   4. The key is an environment secret of `release`, whose deployment rule
#      admits only main. Only `sign` names that environment, and it runs two
#      scripts. Validation, building and publishing happen in jobs that never
#      see the key.
#
# What stays inside the boundary, and is accepted (ADR 0019, ADR 0054): a
# repository admin, anyone who can merge to main, and GitHub itself. Tag
# rulesets and the environment are repository settings; ADR 0054 lists them and
# says how to check they are still in place.
name: release

on:
  workflow_run:
    workflows: [release-candidate]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign and publish, e.g. v2.12.1 (run this from main)"
        required: true

permissions: {}

jobs:
  authorize:
    name: The tag is a release of reviewed code
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      # main's tree, with every branch and tag: the code that decides comes from
      # here, never from the candidate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: This decision runs from main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release.yml must run from main, not $GITHUB_REF"; exit 1
          fi

      # The authorization itself, by main's copy of the script. The commit is
      # the one release-candidate ran on, or the one a dispatched tag names. Its
      # tag must be v<its own VERSION>, must not have moved since the run began,
      # and must be on main — which requires a pull request and the standard's
      # gate. A refused tag still has its name recorded, so the withdrawal below
      # turns any release already shown for it back into a draft.
      - name: The tag is a stable release of a commit on main
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ./tools/authorize-release.sh --tag "$INPUT_TAG" --output "$GITHUB_OUTPUT"
          else
            ./tools/authorize-release.sh --sha "$RUN_SHA" --output "$GITHUB_OUTPUT"
          fi

  # The same gate a pull request passes, run again on the exact commit being
  # released, with no secret and no write token.
  validate:
    name: The source validates
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: The source validates
        run: |
          set -euo pipefail
          ./tools/validate.py
          ./tools/scan-secrets.py
          ./tools/build-bundle.sh --check
          ./tools/render-adapters.sh >/dev/null
          ./tools/test-sync.sh
          ./tools/test-release-archive.sh --throwaway
          ./tools/test-publish-release.sh
          ./tools/test-authorize-release.sh
          ./tools/test-doctor.sh
          ./tools/test-upgrade-starters.sh
          ./tools/test-field-notes.sh
          ./tools/test-impact.sh

  # The only job that can read the key. Two scripts, both from a commit on main.
  # It hands the statement and signature on as outputs — both are public by
  # design — and holds no write token.
  sign:
    name: Sign
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      statement: ${{ steps.sign.outputs.statement }}
      signature: ${{ steps.sign.outputs.signature }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          # sign-release.sh refuses unless HEAD is exactly at a tag, which it
          # resolves with `git describe --exact-match`. A shallow clone has no
          # tags to describe against.
          fetch-depth: 0
          persist-credentials: false

      # Missing prerequisites stop the release. Until v2.4.1 they produced a
      # warning and an unsigned archive published as the official release.
      - name: The prerequisites for signing are in place
        env:
          KEY: ${{ secrets.CAUSEWAY_RELEASE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${KEY:-}" ]; then
            echo "::error::secret CAUSEWAY_RELEASE_KEY is not set on the release environment"; missing=1
          fi
          if [ ! -f bundle/allowed-signers ]; then
            echo "::error::bundle/allowed-signers does not exist"; missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            {
              echo "### Not released: signing is not set up"
              echo ""
              echo "Nothing was published. A release is signed or it is not a release."
              echo ""
              echo '1. `ssh-keygen -t ed25519 -C causeway-release -f causeway-release`'
              echo "2. Put the **private** half in the secret \`CAUSEWAY_RELEASE_KEY\` of the"
              echo "   \`release\` environment — not as a repository secret (ADR 0054)."
              echo "3. Commit the **public** half as \`bundle/allowed-signers\`, in the form"
              echo '   `<principal> ssh-ed25519 AAAA...`, covered by `BUNDLE_FILES` in'
              echo '   `tools/build-bundle.sh`. `validate.py` fails if you do one and not the other.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Sign
        id: sign
        env:
          KEY: ${{ secrets.CAUSEWAY_RELEASE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEYFILE="$(mktemp)"
          # Trailing newline: ssh-keygen rejects a key file without one, and a
          # secret pasted through a web form loses it often enough to be worth
          # not depending on.
          printf '%s\n' "$KEY" > "$KEYFILE"
          trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT
          ./tools/sign-release.sh --key "$KEYFILE"
          echo "statement=$(base64 -w0 bundle/release.statement)" >> "$GITHUB_OUTPUT"
          echo "signature=$(base64 -w0 bundle/release.statement.sig)" >> "$GITHUB_OUTPUT"

      # The artifact is verified before it is published, with the same script a
      # consumer runs and against the anchor consumers will vendor. Publishing a
      # signature nobody has checked would be shipping the one thing here whose
      # only purpose is to be checked.
      - name: Verify what was just signed
        run: ./tools/verify-release.sh

  publish:
    name: Build, check and publish
    needs: [authorize, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the archive, statement and signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # What `sign` produced, checked again here: this job trusts the bytes it
      # was handed only as far as the anchor in the tree says to.
      - name: Receive and verify the signature
        env:
          STATEMENT: ${{ needs.sign.outputs.statement }}
          SIGNATURE: ${{ needs.sign.outputs.signature }}
        run: |
          set -euo pipefail
          printf '%s' "$STATEMENT" | base64 -d > bundle/release.statement
          printf '%s' "$SIGNATURE" | base64 -d > bundle/release.statement.sig
          ./tools/verify-release.sh

      # Built after signing, never before: build-archive.sh folds
      # bundle/release.statement and its .sig into the archive when they exist,
      # and an archive assembled first would be a published install path that
      # cannot satisfy --require-release.
      - name: Build the installable archive
        run: ./tools/build-archive.sh --out dist

      # The checksum published beside the archive is only worth publishing if
      # someone else can arrive at it. Two builds of the same tree must agree,
      # or the sidecar describes one machine's afternoon rather than a release.
      - name: The archive is byte-reproducible
        run: |
          set -euo pipefail
          ./tools/build-archive.sh --out dist-again >/dev/null
          for a in dist/*.tar.gz dist/*.zip; do
            b="dist-again/$(basename "$a")"
            if ! cmp -s "$a" "$b"; then
              echo "::error::$(basename "$a") is not reproducible across builds"
              exit 1
            fi
          done
          rm -rf dist-again
          echo "archives reproduce byte for byte"

      # The artifact consumers will download, installed the way they install it:
      # extracted, no git on PATH, --require-release. Then refused when its
      # statement is altered, its content is altered, or ssh-keygen is missing.
      # Writes dist/.accepted naming the tarball that passed; publish-release.sh
      # publishes nothing else.
      - name: Install the archive as a consumer would
        run: ./tools/test-release-archive.sh --dist dist

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          set -euo pipefail
          ./tools/publish-release.sh --tag "$TAG" --dist dist
          VERSION="$(cat VERSION)"
          {
            echo "### Published \`$TAG\`"
            echo ""
            echo '```'
            cat bundle/release.statement
            echo '```'
            echo ""
            echo "Install without git: the archive carries the statement and its signature,"
            echo "so \`sync.sh --require-release\` works with no git, no credential and no network."
            echo ""
            echo '```sh'
            echo "curl -fsSLO <asset-url>/causeway-$VERSION.tar.gz"
            echo "curl -fsSLO <asset-url>/causeway-$VERSION.tar.gz.sha256"
            echo "sha256sum -c causeway-$VERSION.tar.gz.sha256"
            echo "tar -xzf causeway-$VERSION.tar.gz"
            echo "./causeway-$VERSION/tools/sync.sh /path/to/project --require-release"
            echo '```'
            echo ""
            echo "Consumers who cloned verify with:"
            echo ""
            echo '```sh'
            echo "gh release download $TAG -p 'release.statement*' -D bundle/"
            echo "./tools/verify-release.sh"
            echo '```'
            echo ""
            echo "Checksums:"
            echo ""
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The failure policy. Runs only when a job above failed after the tag was
  # identified — including a tag that `authorize` refused for not being on main.
  # A release a maintainer published from the web before this ran is turned back
  # into a draft, so nobody downloads a release whose evidence did not hold. It
  # uploads nothing, and it runs main's publish-release.sh, not the candidate's.
  withdraw:
    name: Withdraw the release after a failure
    needs: [authorize, validate, sign, publish]
    if: failure() && needs.authorize.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Withdraw
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          set -euo pipefail
          ./tools/publish-release.sh --tag "$TAG" --withdraw
          {
            echo "### Not released: \`$TAG\`"
            echo ""
            echo "A job above failed, so nothing was published. If a release for this"
            echo "tag was already visible, it is now a draft. Fix the cause and re-run."
          } >> "$GITHUB_STEP_SUMMARY"
