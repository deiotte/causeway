# Sign, verify and publish a release.
#
# Every step runs only if every step before it succeeded — the default, and the
# point. Until v2.4.1 the archive steps carried `if: '!cancelled()'`, which
# means "run even after a failure", so a release whose signature had not
# verified, or whose archive did not reproduce, could still have its archive
# attached. The order is now: the source validates, the prerequisites exist,
# the statement is signed and verified, the archive is built, rebuilt
# identically, and installed the way a consumer installs it — and only then
# does tools/publish-release.sh touch the release. If anything fails, the last
# step withdraws a release that is already visible back to a draft. There is no
# unsigned official release: a development archive is `tools/build-archive.sh`
# on a workstation, and is never published from here. ADR 0044.
#
# Runs on a tag, not on a branch, so it is not a required check and does not
# gate any pull request. One job per release, which at the tag rate of this
# repository is a rounding error against the per-commit gate — see ADR 0018.
#
# The key lives in an Actions secret because the maintainer keeps no local
# checkout and publishes tags through the GitHub web interface (ADR 0016 records
# the single-maintainer shape this follows from). That places the signing key
# inside the same trust boundary as the repository, which is a real weakening
# and is argued in ADR 0019 rather than glossed: anyone who can change a
# workflow on a protected main, and GitHub itself, can sign as this key.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to attach the statement and signature to the release

jobs:
  sign:
    name: Sign and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sign-release.sh refuses unless HEAD is exactly at a tag, which it
          # resolves with `git describe --exact-match`. A shallow clone has no
          # tags to describe against.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # A tag that does not name this tree's VERSION would publish one version's
      # bytes under another's name. Checked first, because nothing after it
      # means anything if it fails.
      - name: The tag names this tree's version
        id: tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *) echo "::error::run this workflow on a tag, not $GITHUB_REF"; exit 1 ;;
          esac
          VERSION="$(cat VERSION)"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match VERSION $VERSION"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The same gate a pull request passes, run again on the exact commit being
      # released. A tag can be pushed to a commit that never went through one.
      - name: The source validates
        run: |
          set -euo pipefail
          ./tools/validate.py
          ./tools/build-bundle.sh --check
          ./tools/render-adapters.sh >/dev/null
          ./tools/test-sync.sh
          ./tools/test-release-archive.sh --throwaway
          ./tools/test-publish-release.sh
          ./tools/test-doctor.sh
          ./tools/test-upgrade-starters.sh

      # Missing prerequisites stop the release. Until v2.4.1 they produced a
      # warning and an unsigned archive published as the official release.
      - name: The prerequisites for signing are in place
        env:
          KEY: ${{ secrets.CAUSEWAY_RELEASE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${KEY:-}" ]; then
            echo "::error::secret CAUSEWAY_RELEASE_KEY is not set"; missing=1
          fi
          if [ ! -f bundle/allowed-signers ]; then
            echo "::error::bundle/allowed-signers does not exist"; missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            {
              echo "### Not released: signing is not set up"
              echo ""
              echo "Nothing was published. A release is signed or it is not a release."
              echo ""
              echo '1. `ssh-keygen -t ed25519 -C causeway-release -f causeway-release`'
              echo "2. Put the **private** half in the repository secret \`CAUSEWAY_RELEASE_KEY\`."
              echo "3. Commit the **public** half as \`bundle/allowed-signers\`, in the form"
              echo '   `<principal> ssh-ed25519 AAAA...`, covered by `BUNDLE_FILES` in'
              echo '   `tools/build-bundle.sh`. `validate.py` fails if you do one and not the other.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Sign
        env:
          KEY: ${{ secrets.CAUSEWAY_RELEASE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KEYFILE="$(mktemp)"
          # Trailing newline: ssh-keygen rejects a key file without one, and a
          # secret pasted through a web form loses it often enough to be worth
          # not depending on.
          printf '%s\n' "$KEY" > "$KEYFILE"
          trap 'shred -u "$KEYFILE" 2>/dev/null || rm -f "$KEYFILE"' EXIT
          ./tools/sign-release.sh --key "$KEYFILE"

      # The artifact is verified before it is published, with the same script a
      # consumer runs and against the anchor consumers will vendor. Publishing a
      # signature nobody has checked would be shipping the one thing here whose
      # only purpose is to be checked.
      - name: Verify what was just signed
        run: ./tools/verify-release.sh

      # Built after signing, never before: build-archive.sh folds
      # bundle/release.statement and its .sig into the archive when they exist,
      # and an archive assembled first would be a published install path that
      # cannot satisfy --require-release.
      - name: Build the installable archive
        run: ./tools/build-archive.sh --out dist

      # The checksum published beside the archive is only worth publishing if
      # someone else can arrive at it. Two builds of the same tree must agree,
      # or the sidecar describes one machine's afternoon rather than a release.
      - name: The archive is byte-reproducible
        run: |
          set -euo pipefail
          ./tools/build-archive.sh --out dist-again >/dev/null
          for a in dist/*.tar.gz dist/*.zip; do
            b="dist-again/$(basename "$a")"
            if ! cmp -s "$a" "$b"; then
              echo "::error::$(basename "$a") is not reproducible across builds"
              exit 1
            fi
          done
          rm -rf dist-again
          echo "archives reproduce byte for byte"

      # The artifact consumers will download, installed the way they install it:
      # extracted, no git on PATH, --require-release. Then refused when its
      # statement is altered, its content is altered, or ssh-keygen is missing.
      # Writes dist/.accepted naming the tarball that passed; publish-release.sh
      # publishes nothing else.
      - name: Install the archive as a consumer would
        run: ./tools/test-release-archive.sh --dist dist

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ./tools/publish-release.sh --tag "$TAG" --dist dist
          VERSION="$(cat VERSION)"
          {
            echo "### Published \`$TAG\`"
            echo ""
            echo '```'
            cat bundle/release.statement
            echo '```'
            echo ""
            echo "Install without git: the archive carries the statement and its signature,"
            echo "so \`sync.sh --require-release\` works with no git, no credential and no network."
            echo ""
            echo '```sh'
            echo "curl -fsSLO <asset-url>/causeway-$VERSION.tar.gz"
            echo "curl -fsSLO <asset-url>/causeway-$VERSION.tar.gz.sha256"
            echo "sha256sum -c causeway-$VERSION.tar.gz.sha256"
            echo "tar -xzf causeway-$VERSION.tar.gz"
            echo "./causeway-$VERSION/tools/sync.sh /path/to/project --require-release"
            echo '```'
            echo ""
            echo "Consumers who cloned verify with:"
            echo ""
            echo '```sh'
            echo "gh release download $TAG -p 'release.statement*' -D bundle/"
            echo "./tools/verify-release.sh"
            echo '```'
            echo ""
            echo "Checksums:"
            echo ""
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The failure policy. Runs only when a step above failed. A release a
      # maintainer published from the web before this ran is turned back into a
      # draft, so nobody downloads a release whose evidence did not hold. It
      # uploads nothing.
      - name: Withdraw the release after a failure
        if: failure() && steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ./tools/publish-release.sh --tag "$TAG" --withdraw
          {
            echo "### Not released: \`$TAG\`"
            echo ""
            echo "A step above failed, so nothing was published. If a release for this"
            echo "tag was already visible, it is now a draft. Fix the cause and re-run."
          } >> "$GITHUB_STEP_SUMMARY"
